name: keepalive

# Bate no /healthz do n8n a cada 5 min para o Render free não dormir (15 min sem tráfego).
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Ping n8n
        run: |
          curl -fsS --max-time 90 --retry 3 --retry-delay 10 --retry-all-errors \
            "https://n8n-ro4m.onrender.com/healthz"

      # O GitHub desativa agendamentos de repositório público sem atividade por 60 dias.
      # Se o último commit tiver mais de 45 dias, cria um commit vazio para renovar o prazo.
      - uses: actions/checkout@v4
        if: always()
      - name: Renovar atividade do repositório
        if: always()
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          if [ $((now - last)) -gt $((45 * 86400)) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: renova atividade do keepalive"
            git push
          fi
